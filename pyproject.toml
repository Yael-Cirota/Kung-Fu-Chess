[project]
name = "kfchess"
version = "0.1.0"
description = "Kung-Fu-Chess: a real-time chess variant"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "redis>=4.2",
]

[project.optional-dependencies]
# OpenCV/numpy are only imported under ui/ (the graphics demo) and
# tests/ui/. Server, client, common, protocol and kfchess never import
# them, so server-side installs (and containers) skip a ~200MB GUI
# toolchain. Install with `pip install -e ".[ui]"` to run ui/main.py or
# the ui test suite.
ui = [
    "opencv-python>=5.0.0",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pytest>=8.0",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["kfchess", "ui", "common", "protocol", "server", "client"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: ui -> kfchess"
type = "layers"
layers = ["ui", "kfchess"]

[[tool.importlinter.contracts]]
name = "ui only crosses into kfchess.api"
type = "forbidden"
source_modules = ["ui"]
forbidden_modules = [
    "kfchess.model", "kfchess.rules", "kfchess.realtime",
    "kfchess.engine", "kfchess.input", "kfchess.io", "kfchess.texttests",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Protocol layer sits above kfchess and common"
type = "layers"
layers = ["protocol", "kfchess", "common"]

[[tool.importlinter.contracts]]
name = "Server stack layers"
type = "layers"
layers = ["server", "protocol", "kfchess", "common"]

[[tool.importlinter.contracts]]
name = "Server internals layers"
type = "layers"
layers = ["server.presentation", "server.application", "server.domain"]

# redis_directory/redis_client don't exist yet (Server_Design.md §2's role
# split); listed pre-emptively so the contract covers them the moment
# they're added instead of silently missing new infrastructure.
[[tool.importlinter.contracts]]
name = "Infrastructure is reached only through Protocols"
type = "forbidden"
source_modules = ["server.domain", "server.application"]
forbidden_modules = [
    "server.infrastructure.sqlite_user_repository", "server.infrastructure.connection_factory",
    "server.infrastructure.redis_directory", "server.infrastructure.redis_client",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "redis is reached only through server.infrastructure"
type = "forbidden"
source_modules = [
    "kfchess", "common", "protocol", "ui", "client",
    "server.presentation", "server.application", "server.domain",
]
forbidden_modules = ["redis"]

[[tool.importlinter.contracts]]
name = "Engine and shared layers never import outward"
type = "forbidden"
source_modules = ["kfchess", "common", "protocol"]
forbidden_modules = ["ui", "server", "client"]

[[tool.importlinter.contracts]]
name = "Server and ui never see each other"
type = "forbidden"
source_modules = ["server"]
forbidden_modules = ["ui"]

[[tool.importlinter.contracts]]
name = "VPL path stays free of networking"
type = "forbidden"
source_modules = ["kfchess"]
forbidden_modules = ["websockets", "asyncio", "socket", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Client stack layers"
type = "layers"
layers = ["client", "protocol", "kfchess", "common"]

[[tool.importlinter.contracts]]
name = "ui and client never see the server"
type = "forbidden"
source_modules = ["ui", "client"]
forbidden_modules = ["server"]

[[tool.importlinter.contracts]]
name = "client only crosses into kfchess.api"
type = "forbidden"
source_modules = ["client"]
forbidden_modules = [
    "kfchess.model", "kfchess.rules", "kfchess.realtime",
    "kfchess.engine", "kfchess.input", "kfchess.io", "kfchess.texttests",
]
allow_indirect_imports = true
